# The whole backend on one machine, with tracing: every service, Kafka, MongoDB, Redis, Azurite (blob storage)
# and a Grafana stack (Tempo for traces, Prometheus for metrics, Loki for logs) that receives their telemetry.
#
#   docker compose up --build
#
#   Grafana          http://localhost:3001   (Explore -> Tempo to search traces; no login needed)
#   Deck API         http://localhost:5080   (Swagger UI at /)
#   Identity API     http://localhost:5081
#   Forum API        http://localhost:5082
#   Market API       http://localhost:5083
#   Go worker        http://localhost:8088
#
# Everything here is local: nothing points at Azure, and the values below are throwaway development settings.

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317   # OTLP over gRPC
  ASPNETCORE_ENVIRONMENT: Development
  DOTNET_ENVIRONMENT: Development

x-jwt: &jwt
  Jwt__Key: local-only-jwt-signing-key-change-me-0123456789 # gitleaks:allow (dev-only value)
  Jwt__Issuer: YuGiOhIdentityApi
  Jwt__Audience: YuGiOhDeckBuilderUI

x-kafka: &kafka
  Kafka__BootstrapServers: kafka:9092
  Kafka__SecurityProtocol: Plaintext   # a plain local broker instead of Event Hubs (see KafkaConnection.cs)
  Kafka__ConnectionString: ""

# Azurite's published development account (the same for every Azurite install).
x-azurite: &azurite-conn "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;" # gitleaks:allow

services:
  # ---------------------------------------------------------------- observability
  lgtm:
    image: grafana/otel-lgtm:0.35.0
    ports:
      - "3001:3000"   # Grafana (3000 is left for the Next.js dev server)
      - "4317:4317"   # OTLP gRPC, so services run with `dotnet run` can report here too
      - "4318:4318"   # OTLP HTTP
    volumes:
      - lgtm-data:/data

  # ---------------------------------------------------------------- infrastructure
  mongo:
    image: mongo:8.0
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20

  redis:
    image: redis:8.6
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
    volumes: [azurite-data:/data]

  kafka:
    image: apache/kafka:4.2.2
    ports: ["9094:9094"]   # for Kafka tools on the host: localhost:9094
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      retries: 30

  # Creates the two topics the services use (Event Hubs has them as event hubs), then exits.
  kafka-init:
    image: apache/kafka:4.2.2
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in deck-updates price-drops; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done

  # ---------------------------------------------------------------- services
  go-worker:
    build: ./YuGiOh_Deck_API/go-services
    ports: ["8088:8080"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318   # the Go exporter speaks OTLP over HTTP
      AZURE_STORAGE_CONNECTION_STRING: *azurite-conn
    depends_on: [lgtm, azurite]

  identity:
    build: { context: ., dockerfile: YuGiOhIdentityApi/Dockerfile }
    ports: ["5081:8080"]
    environment:
      <<: [*otel, *jwt]
      MongoDBUsers__ConnectionURI: mongodb://mongo:27017
    depends_on:
      mongo: { condition: service_healthy }
      lgtm: { condition: service_started }

  forum-api:
    build: { context: ., dockerfile: YuGiOh_Forum_API/Dockerfile }
    ports: ["5082:8080"]
    environment:
      <<: [*otel, *jwt]
      MongoDB__ConnectionString: mongodb://mongo:27017
      AzureBlobStorage__ConnectionString: *azurite-conn
    depends_on:
      mongo: { condition: service_healthy }
      lgtm: { condition: service_started }

  market-api:
    build: { context: ., dockerfile: MarketTelemetry.Service/Dockerfile }
    ports: ["5083:8080"]
    environment:
      <<: [*otel, *kafka]
      MongoDBSettings__ConnectionURI: mongodb://mongo:27017
    depends_on:
      mongo: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      lgtm: { condition: service_started }

  api:
    build: { context: ., dockerfile: YuGiOh_Deck_API/Dockerfile }
    ports: ["5080:8080"]
    environment:
      <<: [*otel, *jwt, *kafka]
      MongoDB__ConnectionURI: mongodb://mongo:27017
      CosmosDb__ConnectionString: mongodb://mongo:27017
      BlobStorage__ConnectionString: *azurite-conn
      Redis__ConnectionString: redis:6379
      GoWorker__ConnectionString: http://go-worker:8080
    healthcheck:
      # the runtime image has no curl, so bash's /dev/tcp does the request
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      retries: 20
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      go-worker: { condition: service_started }
      azurite: { condition: service_started }
      lgtm: { condition: service_started }

  analytics:
    build: { context: ., dockerfile: YuGiOh_Analytics_Consumer/Dockerfile }
    environment:
      <<: [*otel, *kafka]
      CosmosDb__ConnectionString: mongodb://mongo:27017
      AzureStorage__ConnectionString: *azurite-conn
      AzureStorage__ContainerName: dead-letters
    depends_on:
      mongo: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      lgtm: { condition: service_started }

volumes:
  lgtm-data:
  mongo-data:
  azurite-data:
